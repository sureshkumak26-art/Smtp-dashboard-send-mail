<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMTP Mail Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b0d12;color:#eef2f7}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:245px;background:#11141b;border-right:1px solid #242936;padding:24px;position:fixed;inset:0 auto 0 0}.logo{font-size:22px;font-weight:800;margin-bottom:35px}.logo span{opacity:.55}.nav button{display:block;width:100%;padding:12px;margin:6px 0;border:0;border-radius:10px;text-align:left;background:transparent;color:#aeb7c5}.nav button.active,.nav button:hover{background:#202531;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{margin:0;font-size:28px}.muted{color:#8f99a8}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#131720;border:1px solid #252b37;border-radius:16px;padding:20px}.metric{font-size:30px;font-weight:800;margin-top:8px}.panel{margin-top:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-bottom:16px}.field label{display:block;margin-bottom:7px;color:#aeb7c5;font-size:13px}input,textarea,select{width:100%;background:#0e1117;border:1px solid #2a303c;color:#fff;border-radius:10px;padding:12px;outline:none}textarea{min-height:180px;resize:vertical}.btn{background:#fff;color:#111;border:0;border-radius:10px;padding:11px 16px;font-weight:700}.btn.secondary{background:#222833;color:#fff}.status{display:inline-flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:#777}.dot.ok{background:#43d17a}.dot.bad{background:#ef6262}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #242936;font-size:13px}th{color:#8f99a8}.badge{padding:5px 8px;border-radius:7px;background:#202631}.badge.sent{color:#67e39a}.badge.failed{color:#ff8585}.badge.queued{color:#ffd166}.hidden{display:none!important}#login{position:fixed;inset:0;background:#080a0e;display:flex;align-items:center;justify-content:center}.loginbox{width:min(400px,90%);background:#131720;border:1px solid #292f3b;border-radius:18px;padding:28px}.toast{position:fixed;right:20px;bottom:20px;background:#fff;color:#111;padding:12px 16px;border-radius:10px;display:none}@media(max-width:900px){.side{width:70px;padding:15px}.logo{font-size:0}.logo:after{content:'✉';font-size:24px}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:20px}.main{margin-left:70px;width:calc(100% - 70px);padding:20px}.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}</style></head><body><div id="login"><form class="loginbox" id="loginForm"><h2>SMTP Mail</h2><p class="muted">Administrator login</p><div class="field"><label>Username</label><input id="username" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn" style="width:100%">Sign in</button></form></div><div class="shell hidden" id="app"><aside class="side"><div class="logo">SMTP <span>MAIL</span></div><div class="nav"><button class="active" data-page="dashboard">Dashboard</button><button data-page="compose">Compose</button><button data-page="logs">Email Logs</button><button data-page="smtp">SMTP Setup</button></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted">SMTP email management</div></div><div><span class="status"><i class="dot" id="smtpDot"></i><span id="smtpText">Checking SMTP…</span></span><button class="btn secondary" id="logout" style="margin-left:12px">Logout</button></div></div><section id="dashboard" class="page"><div class="grid"><div class="card"><div class="muted">Total</div><div class="metric" id="total">0</div></div><div class="card"><div class="muted">Sent</div><div class="metric" id="sent">0</div></div><div class="card"><div class="muted">Failed</div><div class="metric" id="failed">0</div></div><div class="card"><div class="muted">Today</div><div class="metric" id="today">0</div></div></div><div class="card panel"><h3>Recent emails</h3><div id="recent"></div></div></section><section id="compose" class="page hidden"><div class="card"><h3>Compose email</h3><div class="field"><label>Recipients</label><textarea id="recipients" style="min-height:90px" placeholder="customer@example.com"></textarea></div><div class="row"><div class="field"><label>Subject</label><input id="subject"></div><div class="field"><label>Format</label><select id="format"><option value="text">Plain text</option><option value="html">HTML</option></select></div></div><div class="field"><label>Message</label><textarea id="body"></textarea></div><button class="btn" id="send">Send email</button></div></section><section id="logs" class="page hidden"><div class="card"><h3>Email logs</h3><div id="logsTable"></div></div></section><section id="smtp" class="page hidden"><div class="card"><h3>SMTP Setup</h3><p class="muted">Configure the SMTP server used by the dashboard. The password is stored locally and never returned to the browser.</p><div class="row"><div class="field"><label>SMTP Host</label><input id="smtpHost" placeholder="smtp.example.com"></div><div class="field"><label>SMTP Port</label><input id="smtpPort" type="number" value="587"></div></div><div class="row"><div class="field"><label>SMTP Username</label><input id="smtpUser"></div><div class="field"><label>SMTP Password</label><input id="smtpPass" type="password" placeholder="Enter password to save"></div></div><div class="row"><div class="field"><label>From Address</label><input id="smtpFrom" placeholder="My Company &lt;mail@example.com&gt;"></div><div class="field"><label>Security</label><select id="smtpSecure"><option value="false">STARTTLS / port 587</option><option value="true">TLS / port 465</option></select></div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="saveSmtp">Save SMTP</button><button class="btn secondary" id="testSmtp">Test Connection</button></div><p id="smtpSaveStatus" class="muted"></p></div></section></main></div><div class="toast" id="toast"></div><script>const $=id=>document.getElementById(id);function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3000)}async function api(u,o={}){const r=await fetch(u,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}async function check(){const m=await api('/api/me');if(m.authenticated){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadAll()}else $('login').classList.remove('hidden')}$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});check()}catch(e){toast(e.message)}};$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(b.dataset.page).classList.remove('hidden');$('title').textContent=b.textContent;if(b.dataset.page==='logs')loadLogs();if(b.dataset.page==='smtp')loadSMTPSettings()});$('send').onclick=async()=>{try{const d=await api('/api/send',{method:'POST',body:JSON.stringify({recipients:$('recipients').value,subject:$('subject').value,body:$('body').value,format:$('format').value})});toast('Completed: '+d.results.filter(x=>x.status==='sent').length+'/'+d.results.length+' sent');$('recipients').value='';$('body').value='';loadAll()}catch(e){toast(e.message)}};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function table(a){if(!a.length)return '<p class="muted">No email logs yet.</p>';return '<div style="overflow:auto"><table><thead><tr><th>Recipient</th><th>Subject</th><th>Status</th><th>Time</th></tr></thead><tbody>'+a.map(r=>'<tr><td>'+esc(r.recipients)+'</td><td>'+esc(r.subject)+'</td><td><span class="badge '+r.status+'">'+r.status+'</span></td><td>'+esc(r.created_at)+'</td></tr>').join('')+'</tbody></table></div>'}async function loadStats(){const d=await api('/api/stats');['total','sent','failed','today'].forEach(k=>$(k).textContent=d[k]);$('recent').innerHTML=table(await api('/api/logs?limit=8'))}async function loadLogs(){$('logsTable').innerHTML=table(await api('/api/logs?limit=200'))}async function loadSMTP(){const d=await api('/api/smtp/status').catch(()=>({connected:false}));$('smtpDot').className='dot '+(d.connected?'ok':'bad');$('smtpText').textContent=d.connected?'SMTP Connected':'SMTP Offline'}async function loadSMTPSettings(){const d=await api('/api/smtp/settings');$('smtpHost').value=d.host||'';$('smtpPort').value=d.port||587;$('smtpUser').value=d.user||'';$('smtpFrom').value=d.from||'';$('smtpSecure').value=String(!!d.secure);$('smtpPass').value='';$('smtpSaveStatus').textContent=d.configured?'SMTP is configured. Enter a password only when changing credentials.':'SMTP is not configured.'}$('saveSmtp').onclick=async()=>{try{const b={host:$('smtpHost').value,port:Number($('smtpPort').value),user:$('smtpUser').value,pass:$('smtpPass').value,from:$('smtpFrom').value,secure:$('smtpSecure').value==='true'};if(!b.pass)throw Error('Enter the SMTP password to save.');await api('/api/smtp/settings',{method:'POST',body:JSON.stringify(b)});$('smtpPass').value='';$('smtpSaveStatus').textContent='SMTP settings saved.';toast('SMTP saved');loadSMTP()}catch(e){toast(e.message)}};$('testSmtp').onclick=async()=>{try{$('smtpSaveStatus').textContent='Testing SMTP connection…';const d=await api('/api/smtp/test',{method:'POST'});$('smtpSaveStatus').textContent=d.message;toast('SMTP connection successful');loadSMTP()}catch(e){$('smtpSaveStatus').textContent='SMTP test failed: '+e.message;toast(e.message)}};function loadAll(){loadStats();loadSMTP();loadSMTPSettings()}check();</script></body></html>
